label:
  es: SEO
  en: SEO
icon: search

columns:
  main:
    width: 2/3
    sections:
      search:
        type: fields
        fields:
          searchHeadline:
            type: headline
            label: Buscadores
          metaTitle:
            label: Título
            type: text
            maxlength: 65
            help: Si se deja vacío se usa el título de la página.
          metaDescription:
            label: Descripción
            type: textarea
            size: small
            buttons: false
            maxlength: 160
            help: Entre 120 y 160 caracteres. Es lo que se lee en Google.

          socialHeadline:
            type: headline
            label: Al compartir en redes (Open Graph)
          ogTitle:
            label: Título para redes
            type: text
            maxlength: 70
            help: Opcional. Si se deja vacío se usa el título de buscadores.
          ogDescription:
            label: Descripción para redes
            type: textarea
            size: small
            buttons: false
            maxlength: 200
            help: Opcional. Si se deja vacío se usa la descripción de buscadores.

  sidebar:
    width: 1/3
    sections:
      social:
        type: fields
        fields:
          ogImage:
            label: Imagen para redes
            type: files
            multiple: false
            layout: cards
            uploads: images
            help: 1200 × 630 px. Si se deja vacía se usa la del sitio.
          noIndex:
            label: Ocultar de buscadores
            type: toggle
            text:
              - Indexar
              - No indexar
            help: Activa solo para páginas que no deban aparecer en Google.
      files:
        type: files
        label: Archivos de la página

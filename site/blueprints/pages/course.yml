title: Curso
icon: video

tabs:
  # ------------------------------------------------------------------
  # Portada
  # ------------------------------------------------------------------
  hero:
    label:
      es: Portada
      en: Hero
    icon: layers
    columns:
      main:
        width: 2/3
        sections:
          heroFields:
            type: fields
            fields:
              badge:
                label: Etiqueta
                type: text
              heroTitle:
                label: Título (blanco)
                type: text
                width: 1/2
              heroTitleAccent:
                label: Título (degradado)
                type: text
                width: 1/2
              tagline:
                label: Frase corta
                type: text
                help: Se usa también en las tarjetas de curso.
              duration:
                label: Duración
                type: text
                width: 1/2
                icon: clock
              schedule:
                label: Horario
                type: text
                width: 1/2
                icon: calendar
              buttonsHeadline:
                type: headline
                label: Botones
              primaryLabel:
                label: Botón principal
                type: text
                width: 1/2
              primaryLink:
                label: Enlace
                type: text
                width: 1/2
                help: "#inscripcion o una URL"
              secondaryLabel:
                label: Botón secundario
                type: text
                width: 1/2
              syllabusFile:
                label: Temario (PDF)
                type: files
                multiple: false
                layout: list
                width: 1/2
                help: Si está vacío, el botón secundario no se muestra.
      sidebar:
        width: 1/3
        sections:
          heroSidebarFields:
            type: fields
            fields:
              cardImage:
                label: Imagen
                type: files
                multiple: false
                layout: cards
                uploads: images
                help: Se usa en la portada y en las tarjetas de curso.
              cardVideo:
                label: Video (opcional)
                type: files
                multiple: false
                layout: list
                query: page.files.filterBy("type", "video")
                help: MP4 o WebM en mute y en bucle. Si hay video sustituye a la imagen (la imagen queda como póster).

  # ------------------------------------------------------------------
  # Objetivo
  # ------------------------------------------------------------------
  goal:
    label:
      es: Objetivo
      en: Goal
    icon: check
    columns:
      main:
        width: 2/3
        sections:
          goalFields:
            type: fields
            fields:
              goalTitle:
                label: Título (blanco)
                type: text
                width: 1/2
              goalTitleAccent:
                label: Título (degradado)
                type: text
                width: 1/2
              goalText:
                label: Texto
                type: textarea
                size: medium
                buttons: false

  # ------------------------------------------------------------------
  # Temario
  # ------------------------------------------------------------------
  syllabus:
    label:
      es: Temario
      en: Syllabus
    icon: list-bullet
    columns:
      main:
        width: 1/1
        sections:
          syllabusFields:
            type: fields
            fields:
              syllabusTitle:
                label: Título
                type: text
                width: 1/2
              syllabusText:
                label: Introducción
                type: text
                width: 1/2
              sessions:
                label: Sesiones
                type: structure
                empty: Sin sesiones
                columns:
                  title: true
                  duration: true
                fields:
                  title:
                    label: Título de la sesión
                    type: text
                    width: 1/2
                  duration:
                    label: Duración
                    type: text
                    width: 1/2
                  icon:
                    label: Ícono
                    type: select
                    width: 1/2
                    default: guion
                    empty: false
                    options:
                      guion: Guion
                      pincel: Diseño
                      camara: Producción
                      presentacion: Presentación
                  highlight:
                    label: Destacar sesión
                    type: toggle
                    width: 1/2
                    text:
                      - "No"
                      - "Sí"
                  topics:
                    label: Temas
                    type: structure
                    empty: Sin temas
                    fields:
                      text:
                        label: Tema
                        type: text
                  text:
                    label: Descripción
                    type: textarea
                    size: small
                    buttons: false
                    help: Alternativa a la lista de temas.

  # ------------------------------------------------------------------
  # Entregables e instructor
  # ------------------------------------------------------------------
  deliverables:
    label:
      es: Entregables
      en: Deliverables
    icon: box
    columns:
      main:
        width: 1/2
        sections:
          deliverablesFields:
            type: fields
            fields:
              deliverablesTitle:
                label: Título
                type: text
              deliverablesList:
                label: Entregables
                type: structure
                empty: Sin entregables
                fields:
                  text:
                    label: Entregable
                    type: text
      sidebar:
        width: 1/2
        sections:
          deliverablesSidebarFields:
            type: fields
            fields:
              instructorHeadline:
                type: headline
                label: Instructor
              instructor:
                label: Ficha del mentor
                type: pages
                multiple: false
                layout: cards
                query: site.find("nosotros").children.listed
                image:
                  query: page.photo.toFile
                  back: black
                info: "{{ page.role }}"
                empty: Elige un mentor
                help: El nombre, la foto, la frase y los proyectos salen de su ficha (Nosotros → Fichas de mentores).
              instructorBadge:
                label: Etiqueta
                type: text
                width: 1/2
                help: "Su papel en este curso. Ej. Instructor principal"
              instructorLinkLabel:
                label: Texto del enlace
                type: text
                width: 1/2
                help: Enlaza a la ficha del mentor.
              instructorProjectsLabel:
                label: Título de proyectos
                type: text
                help: Antecede a los proyectos que tenga listados en su ficha.

  # ------------------------------------------------------------------
  # Inscripción
  # ------------------------------------------------------------------
  cta:
    label:
      es: Inscripción
      en: Enrollment
    icon: bolt
    columns:
      main:
        width: 2/3
        sections:
          ctaFields:
            type: fields
            fields:
              ctaTitle:
                label: Título
                type: text
              ctaText:
                label: Texto
                type: textarea
                size: small
                buttons: false
              ctaButton:
                label: Botón
                type: text
                width: 1/2
              ctaLink:
                label: Enlace
                type: text
                width: 1/2
      sidebar:
        width: 1/3
        sections:
          ctaSidebarFields:
            type: fields
            fields:
              ctaImage:
                label: Imagen de fondo
                type: files
                multiple: false
                layout: cards
                uploads: images
              ctaVideo:
                label: Video (opcional)
                type: files
                multiple: false
                layout: list
                query: page.files.filterBy("type", "video")
                help: MP4 o WebM en mute y en bucle. Si hay video sustituye a la imagen (la imagen queda como póster).

  # ------------------------------------------------------------------
  # SEO
  # ------------------------------------------------------------------
  # SEO
  # ------------------------------------------------------------------
  seo:
    extends: tabs/seo
